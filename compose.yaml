name: daynomy-local
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run python3 scripts/dev_backend.py init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/dev_backend.py init}
      POSTGRES_DB: ${POSTGRES_DB:?Run python3 scripts/dev_backend.py init}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55459}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
    command: ["postgres", "-c", "log_min_error_statement=panic"]
volumes:
  postgres-data:

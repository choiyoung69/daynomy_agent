[package]
name = "daynomy-sample"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-postgres = "0.7"
uuid = { version = "1", features = ["v4"] }
